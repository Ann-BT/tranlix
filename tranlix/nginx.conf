server {
  listen 80;
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
  location /api/ {
    # Container DNS name must match the backend service name in whichever
    # compose file this frontend is deployed alongside (tranlix-platform's
    # docker-compose.yml and tranlix-infra's deploy compose both name it
    # "api", not "backend") -- baked in at image build time, so a mismatch
    # here can't be patched by editing the compose file after the fact.
    proxy_pass http://api:8000;
  }
}
