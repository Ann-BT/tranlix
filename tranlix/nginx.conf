server {
  listen 80;
  # nginx defaults to 1m, which silently 413s any upload above that --
  # before the request ever reaches the backend, so app/core/config.py's
  # own MAX_UPLOAD_MB=100 check never even runs. Matches that setting (with
  # a little headroom for multipart form overhead) rather than duplicating
  # the number as a hardcoded guess.
  client_max_body_size 110m;
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
  location /api/ {
    # Container DNS name must match the backend service name in whichever
    # compose file this frontend is deployed alongside (tranlix-platform's
    # docker-compose.yml and tranlix-infra's deploy compose both name it
    # "api", not "backend") -- baked in at image build time, so a mismatch
    # here can't be patched by editing the compose file after the fact.
    proxy_pass http://api:8000;
  }
}
